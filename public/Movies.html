<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Movies | Mini Information System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header></header>
<main>
  <div class="head">
    <div><h1>Movie collection</h1><p class="sub" style="margin:0">Add, edit, and delete movies.</p></div>
  </div>

  <div class="panel">
    <h2 id="formTitle">Add movie</h2>
    <div class="inline">
      <input id="title" placeholder="Title" aria-label="Title">
      <input id="genre" placeholder="Genre" aria-label="Genre">
      <input id="year" type="number" placeholder="Year" aria-label="Year">
      <button class="btn" id="save">Add movie</button>
      <button class="btn ghost" id="cancel" style="display:none">Cancel</button>
    </div>
    <div class="msg" id="message" role="alert"></div>
  </div>

  <div class="panel">
    <table>
      <thead><tr><th>ID</th><th>Title</th><th>Genre</th><th>Year</th><th></th></tr></thead>
      <tbody id="movieList"></tbody>
    </table>
    <p class="empty" id="empty" style="display:none">No movies yet. Add one above.</p>
  </div>
</main>
<script src="common.js"></script>
<script>
header('movies.html');
let all = [], editId = null;

function say(text, ok) {
  message.textContent = text;
  message.className = 'msg' + (ok ? ' ok' : '');
  message.style.display = 'block';
}

async function load() {
  try {
    all = await api('/api/movies');
    empty.style.display = all.length ? 'none' : 'block';
    movieList.innerHTML = all.map((m) => `<tr>
      <td>${m.id}</td><td>${esc(m.title)}</td><td>${esc(m.genre)}</td><td>${m.year}</td>
      <td class="actions">
        <button class="btn ghost small" onclick="edit(${m.id})">Edit</button>
        <button class="btn danger small" onclick="remove(${m.id})">Delete</button>
      </td></tr>`).join('');
  } catch (e) { say(e.message, false); }
}

function reset() {
  editId = null; title.value = genre.value = year.value = '';
  formTitle.textContent = 'Add movie'; save.textContent = 'Add movie'; cancel.style.display = 'none';
}

function edit(id) {
  const m = all.find((x) => x.id === id);
  editId = id; title.value = m.title; genre.value = m.genre; year.value = m.year;
  formTitle.textContent = 'Edit movie'; save.textContent = 'Save changes'; cancel.style.display = '';
  title.focus();
}

save.onclick = async () => {
  try {
    const body = { title: title.value.trim(), genre: genre.value.trim(), year: year.value };
    await api(editId ? '/api/movies/' + editId : '/api/movies', editId ? 'PUT' : 'POST', body);
    say(editId ? 'Movie updated' : 'Movie added successfully', true);
    reset(); load();
  } catch (e) { say(e.message, false); }
};
cancel.onclick = reset;

async function remove(id) {
  if (!confirm('Delete this movie?')) return;
  await api('/api/movies/' + id, 'DELETE');
  if (editId === id) reset();
  load();
}

load();
</script>
</body>
</html>
